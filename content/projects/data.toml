  { name = "Documentation", url = "https://swiftpackageindex.com/computer-graphics-tools/shared-graphics-tools/documentation/sharedgraphicstools" },
]

[[project]]
name = "CoreVideoTools"
desc = "CoreVideoTools offers a more idiomatic Swift interface to CoreVideo functionality, making it easier and safer to work with [CVPixelBuffers](https://developer.apple.com/documentation/corevideo/cvpixelbuffer-q2e), [IOSurfaces](https://developer.apple.com/documentation/iosurface), and related CoreVideo concepts in Swift code."
tags = ["iOS", "CoreVideo"]
img = "https://github.com/computer-graphics-tools/core-video-tools/raw/main/Sources/CoreVideoTools/CoreVideoTools.docc/Resources/table-of-contents-art/core-video-tools@2x.png"
links = [
  { name = "GitHub", url = "https://github.com/computer-graphics-tools/core-video-tools" },
  { name = "Documentation", url = "https://swiftpackageindex.com/computer-graphics-tools/core-video-tools/documentation/corevideotools" },
]

[[project]]
name = "Smelter"
desc = "Overhead-free [ONNX](https://onnx.ai) graph inference engine with [Metal Performance Shaders](https://developer.apple.com/documentation/metalperformanceshaders) under the hood."
tags = ["iOS", "Metal", "ONNX"]
links = [
  { name = "GitHub", url = "https://github.com/prisma-ai/Smelter" },
